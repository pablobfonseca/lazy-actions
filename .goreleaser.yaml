version: 2

project_name: lazyactions

builds:
  - main: .
    binary: lazyactions
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  use: github-native

homebrew_casks:
  - name: lazyactions
    repository:
      owner: pablobfonseca
      name: homebrew-tap
      branch: master
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/pablobfonseca/lazy-actions"
    description: "Bubble Tea TUI that watches GitHub Actions runs and sends desktop/mobile notifications"
    commit_author:
      name: goreleaser
      email: goreleaser@users.noreply.github.com
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/lazyactions"]
          end
