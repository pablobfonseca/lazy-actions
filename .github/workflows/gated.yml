name: gated

# Fixture for the TUI's approve action (`p`). Both deploy jobs hold the run at
# status "waiting": approval-test through a required reviewer, timer-test
# through a 30-minute wait timer. Together they cover the two gate shapes the
# pending_deployments endpoint returns.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: echo "built, waiting on approval to deploy"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: approval-test
    steps:
      - run: echo "approved and deployed"

  deploy-timed:
    needs: build
    runs-on: ubuntu-latest
    environment: timer-test
    steps:
      - run: echo "timer bypassed and deployed"
