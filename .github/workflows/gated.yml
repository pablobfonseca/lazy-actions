name: gated

# Fixture for the TUI's approve action (`p`). The deploy job is held at
# status "waiting" by the approval-test environment's required reviewer,
# which is the state the run list needs to render and approve.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: echo "built, waiting on approval to deploy"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: approval-test
    steps:
      - run: echo "approved and deployed"
